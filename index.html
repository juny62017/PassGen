<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>PassGen</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <div class="main-box">

        <div class="top-section">

            <h1>
                PassGen
            </h1>

            <p class="main-text">
                A soft and simple password generator
            </p>

        </div>

        <div class="password-section">

            <label class="section-label">
                Generated Password
            </label>

            <div class="password-box">

                <input
                    type="text"
                    id="passwordOutput"
                    placeholder="Your password will appear here"
                >

                <button class="copy-btn">
                    Copy
                </button>

            </div>

            <p class="copy-message">
                Password copied
            </p>

        </div>

        <div class="options-section">

            <label class="section-label">
                Password Length
            </label>

            <input
                type="range"
                min="6"
                max="24"
                value="12"
                id="lengthSlider"
            >

            <p class="length-text">
                Length: 12
            </p>

            <div class="checkbox-group">

                <label class="option-item">

                    <input
                        type="checkbox"
                        id="uppercaseCheck"
                        checked
                    >

                    Uppercase Letters

                </label>

                <label class="option-item">

                    <input
                        type="checkbox"
                        id="lowercaseCheck"
                        checked
                    >

                    Lowercase Letters

                </label>

                <label class="option-item">

                    <input
                        type="checkbox"
                        id="numbersCheck"
                        checked
                    >

                    Numbers

                </label>

                <label class="option-item">

                    <input
                        type="checkbox"
                        id="symbolsCheck"
                    >

                    Symbols

                </label>

            </div>

        </div>

        <div class="strength-section">

            <label class="section-label">
                Password Strength Checker
            </label>

            <input
                type="password"
                id="strengthInput"
                placeholder="Type password here"
            >

            <div class="strength-bar">

                <div class="strength-fill"></div>

            </div>

            <p class="strength-text">
                Strength: Weak
            </p>

        </div>

        <button class="generate-btn">
            Generate Password
        </button>

    </div>

    <script src="script.js"></script>

</body>
</html>
